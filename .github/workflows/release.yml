name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Always Listening ${{ github.ref_name }}
          body: |
            ## Always Listening ${{ github.ref_name }}

            ### Downloads
            - **macOS (Apple Silicon)**: `Always-Listening_${{ steps.version.outputs.version }}_aarch64.dmg`
            - **macOS (Intel)**: `Always-Listening_${{ steps.version.outputs.version }}_x64.dmg`
            - **Windows Installer (MSI)**: `Always-Listening_${{ steps.version.outputs.version }}_x64-setup.msi`
            - **Windows Installer (EXE/NSIS)**: `Always-Listening_${{ steps.version.outputs.version }}_x64-setup.exe`
          draft: true
          prerelease: false

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-13
    needs: create-release
    defaults:
      run:
        working-directory: ./tray-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tray-app/package-lock.json

      - name: Install Rust stable (x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tray-app/src-tauri -> target'
          key: macos-intel-release

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tray-app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-apple-darwin --config src-tauri/tauri.conf.release.json

  build-macos-silicon:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    defaults:
      run:
        working-directory: ./tray-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tray-app/package-lock.json

      - name: Install Rust stable (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tray-app/src-tauri -> target'
          key: macos-silicon-release

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: tray-app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target aarch64-apple-darwin --config src-tauri/tauri.conf.release.json

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    defaults:
      run:
        working-directory: ./tray-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tray-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tray-app/src-tauri -> target'
          key: windows-release

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: tray-app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config src-tauri/tauri.conf.release.json

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-macos-intel, build-macos-silicon, build-windows]

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
